<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meeting Notes — Wireframe tương tác</title>
<meta name="description" content="Wireframe tương tác cho toàn bộ luồng Meeting Notes: transcript, Todo, công việc, chat, cài đặt và thùng rác. Chỉ dữ liệu mô phỏng.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%2316181d'/%3E%3Ctext x='16' y='21' text-anchor='middle' font-size='13' fill='white'%3EMN%3C/text%3E%3C/svg%3E">
<style>
/* ============================================================
   DESIGN TOKENS — see DESIGN.md (scoped to this wireframe only)
   Monochrome operational wireframe. Blue accent = actions only.
   ============================================================ */
:root{
  --ink:#16181d; --ink-2:#3d434d; --ink-3:#667085; --ink-4:#98a2b3;
  --line:#d0d5dd; --line-soft:#e7eaee; --line-strong:#b8bfc9;
  --paper:#f2f3f5; --surface:#ffffff; --surface-2:#f8f9fb; --surface-3:#eef0f3;
  --accent:#2456f0; --accent-ink:#1a3fb8; --accent-soft:#edf2fe; --accent-line:#c3d2fb;
  --warn-ink:#7a4d00; --warn-bg:#fdf4e0; --warn-line:#ecd9a8;
  --danger-ink:#a0221b; --danger-bg:#fdeeed; --danger-line:#f0c5c1;
  --ok-ink:#1e6b34; --ok-bg:#e9f5ec; --ok-line:#bfe3c8;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
  --r-s:4px; --r-m:6px; --r-l:10px;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px; --sp-7:48px;
  --shadow-1:0 1px 2px rgba(22,24,29,.06);
  --shadow-2:0 4px 16px rgba(22,24,29,.10);
  --sidebar-w:232px; --rail-w:300px; --topbar-h:52px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px}
body{font-family:var(--sans);font-size:13.5px;line-height:1.5;color:var(--ink);background:var(--paper);
  -webkit-font-smoothing:antialiased}
h1{font-size:20px;font-weight:700;letter-spacing:-.01em}
h2{font-size:16px;font-weight:700;letter-spacing:-.01em}
h3{font-size:13.5px;font-weight:600}
a{color:var(--accent-ink);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
::placeholder{color:var(--ink-4)}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:2px}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}
}

/* ---------- App chrome ---------- */
#banner{position:sticky;top:0;z-index:60;background:var(--ink);color:#e8eaee;font-size:11.5px;
  padding:5px 16px;display:flex;gap:12px;align-items:center;justify-content:center;letter-spacing:.02em}
#banner .dot{width:6px;height:6px;border-radius:50%;background:#f2b23e;flex:none}
.app{display:flex;min-height:calc(100vh - 26px)}
#sidebar{width:var(--sidebar-w);flex:none;background:var(--surface);border-right:1px solid var(--line);
  display:flex;flex-direction:column;position:sticky;top:26px;height:calc(100vh - 26px);overflow-y:auto}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
#topbar{height:var(--topbar-h);flex:none;background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:var(--sp-3);padding:0 var(--sp-4);position:sticky;top:26px;z-index:50}
.content-row{flex:1;display:flex;min-width:0}
#view{flex:1;min-width:0;padding:var(--sp-5);max-width:1060px}
#rail{width:var(--rail-w);flex:none;border-left:1px solid var(--line);background:var(--surface-2);
  padding:var(--sp-4);overflow-y:auto;position:sticky;top:78px;height:calc(100vh - 104px);font-size:12.5px;color:var(--ink-2)}
#foot{flex:none;border-top:1px solid var(--line-soft);background:var(--surface);padding:6px var(--sp-4);
  font-size:11.5px;color:var(--ink-3);display:flex;gap:16px;flex-wrap:wrap}

/* Sidebar */
.side-head{padding:var(--sp-3) var(--sp-4);border-bottom:1px solid var(--line-soft)}
.side-head .brand{font-weight:700;font-size:14px;display:flex;gap:8px;align-items:center}
.side-head .brand .logo{width:22px;height:22px;border:1.5px solid var(--ink);border-radius:var(--r-s);
  display:grid;place-items:center;font-family:var(--mono);font-size:10px;font-weight:700}
.side-head .sub{font-size:11px;color:var(--ink-3);margin-top:2px}
.side-nav{padding:var(--sp-2);flex:1}
.side-sec{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-4);
  padding:var(--sp-3) var(--sp-2) var(--sp-1);font-weight:600}
.nav-item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;
  padding:6px var(--sp-2);border-radius:var(--r-s);font-size:13px;color:var(--ink-2)}
.nav-item:hover{background:var(--surface-3)}
.nav-item.active{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.nav-item .sid{font-family:var(--mono);font-size:10px;color:var(--ink-4);margin-left:auto}
.nav-item.active .sid{color:var(--accent-ink)}
.nav-item .nbadge{font-family:var(--mono);font-size:10px;background:var(--surface-3);border:1px solid var(--line);
  border-radius:8px;padding:0 5px;color:var(--ink-2)}
.side-foot{border-top:1px solid var(--line-soft);padding:var(--sp-2);display:flex;flex-direction:column;gap:2px}
.side-user{padding:6px var(--sp-2);font-size:12px;color:var(--ink-3)}
.side-user b{color:var(--ink);display:block;font-size:12.5px}

/* Topbar */
.crumb{font-size:13px;color:var(--ink-3);display:flex;gap:6px;align-items:center;min-width:0}
.crumb b{color:var(--ink);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-sp{flex:1}
.tb-ctl{display:flex;gap:var(--sp-2);align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:4px 10px;font-size:12px;color:var(--ink-3)}
.seg button.on{background:var(--ink);color:#fff}
#burger{display:none}

/* ---------- Primitives ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);
  border-radius:var(--r-m);padding:5px 12px;font-size:12.5px;font-weight:500;color:var(--ink);white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-ink)}
.btn.quiet{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.quiet:hover{background:var(--surface-3)}
.btn.danger{color:var(--danger-ink);border-color:var(--danger-line);background:var(--surface)}
.btn.danger:hover{background:var(--danger-bg)}
.btn.sm{padding:2px 8px;font-size:11.5px}
.btn.lg{padding:8px 18px;font-size:13.5px}
.btn.block{width:100%;justify-content:center}
.linklike{background:none;border:0;padding:0;color:var(--accent-ink);font-size:inherit}
.linklike:hover{text-decoration:underline}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--shadow-1)}
.card .card-h{padding:var(--sp-3) var(--sp-4);border-bottom:1px solid var(--line-soft);display:flex;
  align-items:center;gap:var(--sp-2);flex-wrap:wrap}
.card .card-h h2,.card .card-h h3{margin-right:auto}
.card .card-b{padding:var(--sp-4)}
.card .card-f{padding:var(--sp-3) var(--sp-4);border-top:1px solid var(--line-soft);display:flex;gap:var(--sp-2);
  align-items:center;flex-wrap:wrap}
.stack>*+*{margin-top:var(--sp-3)}
.row{display:flex;gap:var(--sp-2);align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--sp-3)}

.badge{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;
  padding:1px 8px;font-size:11px;font-weight:500;color:var(--ink-2);background:var(--surface);white-space:nowrap}
.badge.mono{font-family:var(--mono);font-size:10px}
.badge.blue{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent-ink)}
.badge.warn{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn-ink)}
.badge.danger{background:var(--danger-bg);border-color:var(--danger-line);color:var(--danger-ink)}
.badge.ok{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok-ink)}
.badge.gray{background:var(--surface-3);color:var(--ink-3)}

.tag{display:inline-block;font-family:var(--mono);font-size:10.5px;border:1px dashed var(--line-strong);
  border-radius:var(--r-s);padding:0 5px;color:var(--ink-3);background:var(--surface-2)}

.note{border:1px dashed var(--line-strong);background:var(--surface-2);border-radius:var(--r-m);
  padding:var(--sp-2) var(--sp-3);font-size:12px;color:var(--ink-3)}
.note b{color:var(--ink-2)}
.note.blue{border-color:var(--accent-line);background:var(--accent-soft);color:var(--accent-ink)}
.note.warn{border-color:var(--warn-line);background:var(--warn-bg);color:var(--warn-ink)}
.note.danger{border-color:var(--danger-line);background:var(--danger-bg);color:var(--danger-ink)}
.note .ref{font-family:var(--mono);font-size:10px;color:var(--ink-4);display:block;margin-top:2px}

.callout{border:1px solid var(--line);border-left:3px solid var(--ink-3);background:var(--surface);
  border-radius:var(--r-m);padding:var(--sp-3) var(--sp-4);font-size:12.5px;color:var(--ink-2)}
.callout.blue{border-left-color:var(--accent)}
.callout.warn{border-left-color:var(--warn-ink);background:var(--warn-bg)}
.callout.danger{border-left-color:var(--danger-ink);background:var(--danger-bg)}

.stepnum{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;flex:none;
  border:1.5px solid var(--ink);font-family:var(--mono);font-size:10.5px;font-weight:700;background:var(--surface)}
.stepnum.done{background:var(--ink);color:#fff;border-color:var(--ink)}
.stepnum.now{border-color:var(--accent);color:var(--accent-ink)}

.kbd{font-family:var(--mono);font-size:10.5px;border:1px solid var(--line-strong);border-bottom-width:2px;
  border-radius:4px;padding:0 4px;background:var(--surface);color:var(--ink-2)}

/* Forms */
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:var(--sp-3)}
.field label{font-size:12px;font-weight:600;color:var(--ink-2)}
.field .hint{font-size:11.5px;color:var(--ink-3)}
.field .err{font-size:11.5px;color:var(--danger-ink);display:none}
.field.invalid .err{display:block}
.field.invalid input,.field.invalid select,.field.invalid textarea{border-color:var(--danger-ink)}
.input,select.input,textarea.input{border:1px solid var(--line-strong);border-radius:var(--r-m);
  padding:6px 10px;font-size:13px;background:var(--surface);width:100%}
.input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 2px var(--accent-soft)}
textarea.input{resize:vertical;font-family:var(--mono);font-size:12px;line-height:1.55}
.check{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--ink-2)}
.check input{margin-top:2px}

/* Tables */
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);
  font-weight:600;padding:6px 10px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line-soft);vertical-align:top}
.tbl tr:hover td{background:var(--surface-2)}
.tbl .num{font-family:var(--mono);font-size:11px;color:var(--ink-3)}

/* Tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:var(--sp-4);flex-wrap:wrap}
.tab{border:0;background:none;padding:8px 14px;font-size:13px;color:var(--ink-3);border-bottom:2px solid transparent;
  margin-bottom:-1px;display:flex;gap:6px;align-items:center}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}

/* List rows / items */
.item{border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface);padding:var(--sp-3) var(--sp-4)}
.item+.item{margin-top:var(--sp-2)}
.item.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.item .item-t{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.item .item-t .ttl{font-weight:600;font-size:13px}
.item .meta{font-size:11.5px;color:var(--ink-3);display:flex;gap:10px;flex-wrap:wrap;margin-top:3px}
.item .acts{display:flex;gap:6px;margin-top:var(--sp-2);flex-wrap:wrap}

.quote{border-left:3px solid var(--line-strong);background:var(--surface-2);padding:6px 10px;
  font-family:var(--mono);font-size:11.5px;color:var(--ink-2);border-radius:0 var(--r-s) var(--r-s) 0;white-space:pre-wrap;overflow-wrap:break-word}
.quote.clickable{cursor:pointer}
.quote.clickable:hover{border-left-color:var(--accent);background:var(--accent-soft)}

/* Progress */
.prog{height:8px;border:1px solid var(--line);border-radius:999px;background:var(--surface-2);overflow:hidden}
.prog>i{display:block;height:100%;background:var(--accent);transition:width .3s}
.prog.gray>i{background:var(--ink-4)}
.step-list{list-style:none}
.step-list li{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--line-soft);font-size:12.5px}
.step-list li:last-child{border-bottom:0}
.step-list .st{margin-left:auto;font-size:11px;white-space:nowrap}

/* Diff (before/after) */
.diff{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-2);font-size:12px}
.diff .d-col{border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden}
.diff .d-h{padding:4px 10px;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;
  background:var(--surface-3);color:var(--ink-3)}
.diff .d-b{padding:8px 10px}
.diff .del{background:var(--danger-bg);text-decoration:line-through;color:var(--danger-ink)}
.diff .ins{background:var(--ok-bg);color:var(--ok-ink)}

/* Timeline */
.tl{list-style:none;border-left:2px solid var(--line);margin-left:6px;padding-left:16px}
.tl li{position:relative;padding:6px 0;font-size:12.5px}
.tl li::before{content:"";position:absolute;left:-21px;top:12px;width:8px;height:8px;border-radius:50%;
  background:var(--surface);border:2px solid var(--ink-3)}
.tl li.ev-create::before{border-color:var(--accent)}
.tl .tl-when{font-family:var(--mono);font-size:10.5px;color:var(--ink-4);display:block}

/* Chat */
.chat-wrap{display:flex;gap:var(--sp-4);align-items:flex-start}
.chat-list{width:250px;flex:none}
.chat-main{flex:1;min-width:0}
.msg{display:flex;gap:10px;margin-bottom:var(--sp-4)}
.msg .av{width:26px;height:26px;flex:none;border:1px solid var(--line-strong);border-radius:var(--r-s);
  display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--surface-2)}
.msg .body{flex:1;min-width:0}
.msg .who{font-size:11.5px;color:var(--ink-3);margin-bottom:2px}
.msg .bubble{border:1px solid var(--line);border-radius:var(--r-m);padding:var(--sp-2) var(--sp-3);
  background:var(--surface);font-size:13px}
.msg.user .bubble{background:var(--surface-2)}
.msg .cite{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--accent-line);
  background:var(--accent-soft);color:var(--accent-ink);border-radius:var(--r-s);padding:1px 7px;
  font-size:11px;margin:2px 4px 2px 0;cursor:pointer}
.msg .cite:hover{background:#dfe8fd}
.msg .cite.deleted{border-color:var(--danger-line);background:var(--danger-bg);color:var(--danger-ink);cursor:not-allowed}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:var(--sp-2) 0}
.chip{border:1px solid var(--line);border-radius:999px;background:var(--surface);padding:3px 10px;font-size:11.5px;color:var(--ink-2)}
.chip:hover{border-color:var(--accent);color:var(--accent-ink)}
.chat-input{display:flex;gap:8px;border:1px solid var(--line-strong);border-radius:var(--r-m);
  background:var(--surface);padding:6px}
.chat-input input{flex:1;border:0;outline:none;font-size:13px;background:none}

/* Empty state */
.empty{border:1.5px dashed var(--line-strong);border-radius:var(--r-l);padding:var(--sp-6) var(--sp-5);
  text-align:center;color:var(--ink-3);background:var(--surface-2)}
.empty .big{font-size:15px;font-weight:600;color:var(--ink-2);margin-bottom:4px}

/* Annotation rail */
#rail h3{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-4);margin:var(--sp-3) 0 var(--sp-1)}
#rail h3:first-child{margin-top:0}
#rail .rn{font-size:12px;color:var(--ink-2);padding:6px 0;border-bottom:1px dashed var(--line-soft)}
#rail .rn .ref{font-family:var(--mono);font-size:10px;color:var(--ink-4);display:block}
#rail .screen-id{font-family:var(--mono);font-size:11px;background:var(--surface-3);border:1px solid var(--line);
  padding:2px 8px;border-radius:var(--r-s);display:inline-block;margin-bottom:6px}

/* Dialogs */
dialog{border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--shadow-2);padding:0;
  max-width:640px;width:min(92vw,640px);color:var(--ink)}
dialog::backdrop{background:rgba(22,24,29,.45)}
.dlg-h{padding:var(--sp-3) var(--sp-4);border-bottom:1px solid var(--line-soft);display:flex;align-items:center;gap:8px}
.dlg-h h2{font-size:15px;margin-right:auto}
.dlg-b{padding:var(--sp-4);max-height:70vh;overflow-y:auto}
.dlg-f{padding:var(--sp-3) var(--sp-4);border-top:1px solid var(--line-soft);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.dlg-wide{width:min(94vw,860px)}

/* Drawer (quote pin) */
#drawer{position:fixed;top:26px;right:0;bottom:0;width:min(480px,92vw);background:var(--surface);
  border-left:1px solid var(--line);box-shadow:var(--shadow-2);z-index:70;transform:translateX(102%);
  transition:transform .22s ease;display:flex;flex-direction:column}
#drawer.open{transform:none}
#drawer .d-head{padding:var(--sp-3) var(--sp-4);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
#drawer .d-body{padding:var(--sp-4);overflow-y:auto;flex:1}
#drawer .d-foot{padding:var(--sp-3) var(--sp-4);border-top:1px solid var(--line-soft);font-size:11.5px;color:var(--ink-3)}

/* Flow map */
.jcard{cursor:pointer;transition:border-color .15s}
.jcard:hover{border-color:var(--accent)}
.jcard .screens{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.jcard .branch{font-size:11.5px;color:var(--ink-3);margin-top:6px}
.jcard .branch li{margin-left:16px}

/* Auth screens (no sidebar) */
.auth-shell{min-height:calc(100vh - 26px);display:grid;place-items:center;padding:var(--sp-5)}
.auth-card{width:min(420px,94vw)}
.auth-brand{display:flex;gap:10px;align-items:center;justify-content:center;margin-bottom:var(--sp-4);color:var(--ink-3);font-size:12.5px}

/* Utility */
.mt-1{margin-top:var(--sp-1)}.mt-2{margin-top:var(--sp-2)}.mt-3{margin-top:var(--sp-3)}.mt-4{margin-top:var(--sp-4)}.mt-5{margin-top:var(--sp-5)}
.mb-2{margin-bottom:var(--sp-2)}.mb-3{margin-bottom:var(--sp-3)}.mb-4{margin-bottom:var(--sp-4)}
.muted{color:var(--ink-3)}.faint{color:var(--ink-4)}.small{font-size:12px}.xsmall{font-size:11px}
.mono{font-family:var(--mono);font-size:11.5px}
.right{margin-left:auto}
.nowrap{white-space:nowrap}
.hidden{display:none!important}
.w100{width:100%}
hr.sep{border:0;border-top:1px solid var(--line-soft);margin:var(--sp-4) 0}
.sec-title{display:flex;align-items:center;gap:8px;margin:var(--sp-5) 0 var(--sp-2)}
.sec-title h2{margin-right:auto}
.page-head{display:flex;align-items:flex-start;gap:var(--sp-3);margin-bottom:var(--sp-4);flex-wrap:wrap}
.page-head .sub{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:4px 12px;font-size:12.5px}
.kv dt{color:var(--ink-3)}
.kv dd{color:var(--ink)}
.avatar-sq{width:22px;height:22px;border:1px solid var(--line-strong);border-radius:var(--r-s);

/* Responsive */
@media (max-width:1100px){ #rail{display:none} #rail.open{display:block;position:fixed;right:0;top:26px;bottom:0;
  z-index:65;box-shadow:var(--shadow-2);width:min(320px,90vw)} }
@media (max-width:768px){
  #sidebar{position:fixed;left:0;top:26px;bottom:0;z-index:66;transform:translateX(-102%);transition:transform .2s}
  #sidebar.open{transform:none}
  #burger{display:inline-flex}
  #view{padding:var(--sp-3)}
  .grid2,.grid3{grid-template-columns:1fr}
  .chat-wrap{flex-direction:column}
  .chat-list{width:100%}
  .diff{grid-template-columns:1fr}
  .kv{grid-template-columns:110px 1fr}
  .tbl{font-size:12px}
  .hide-md{display:none}
}
@media (max-width:390px){
  body{font-size:13px}
  #view{padding:var(--sp-2)}
  .tb-ctl .hide-sm{display:none}
  .btn{padding:5px 9px}
  .tbl .hide-xs{display:none}
}

/* ---------------- State (localStorage; never persist secrets) --------- */
const LS_KEY='mn-wireframe-v1';
let S = null;
function loadState(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){ S = JSON.parse(raw); S.ui = S.ui || seed().ui; return; }
  }catch(e){/* corrupted -> reseed */}
  S = seed();
}
function saveState(){
  try{
    const c = JSON.parse(JSON.stringify(S));
    // Never persist secrets: passwords/tokens are never written into S at all.
    localStorage.setItem(LS_KEY, JSON.stringify(c));
  }catch(e){/* storage unavailable -> memory only */}
}
function resetDemo(){
  try{ localStorage.removeItem(LS_KEY); }catch(e){}
  S = seed(); saveState(); location.hash = '#/login'; route();
}

/* ---------------- Router ---------------------------------------------- */
function resolveRoute(){
  const parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
  const name = parts[0]||'login', arg = parts[1]||null, sub = parts[2]||null;
  if(name==='meetings' && arg==='new') return {name:'meetingNew', arg:null};
  if(name==='tasks' && arg==='new') return {name:'taskNew', arg:null};
  if(name==='meeting' && arg){
    if(sub==='identity') return {name:'meetingIdentity', arg};
    if(sub==='analysis') return {name:'meetingAnalysis', arg};
    return {name:'meetingDetail', arg};
  }
  if(name==='task' && arg) return {name:'taskDetail', arg};
  if(name==='project' && arg) return {name:'projectDetail', arg};
  if(name==='settings' && arg==='providers') return {name:'providers', arg:null};
  if(name==='settings' && arg==='account') return {name:'account', arg:null};
  return {name, arg};
}
function go(path){ location.hash = path; }
function route(){
  const r = resolveRoute();
  if(r.arg){
    if(r.name==='meetingDetail'||r.name==='meetingIdentity'||r.name==='meetingAnalysis') S.ui.meetingId=r.arg;
    if(r.name==='taskDetail') S.ui.taskId=r.arg;
    if(r.name==='projectDetail') S.ui.projectId=r.arg;
  }
  const pub = ['login','setup','flows','primitives'];
  if(!S.auth.loggedIn && !pub.includes(r.name)) { location.hash='#/login'; return; }
  if(S.auth.loggedIn && r.name==='login'){ location.hash='#/dashboard'; return; }
  S.ui.sidebarOpen=false;
  render(r);
  window.scrollTo(0,0);
}

function screenTitle(r){
  const base = SCREENS[r.name] ? (S.locale==='en'?SCREENS[r.name].t.en:SCREENS[r.name].t.vi) : r.name;

  if(r.name==='taskDetail' && S.ui.taskId){ const k=task(S.ui.taskId); return k?`${k.code} · ${k.title}`:base; }
  return base;
}

/* ---------------- S09 Analysis run -------------------------------------- */
function rMeetingAnalysis(){
  const m = meet(S.ui.meetingId); if(!m) return '<div class="empty">Không tìm thấy cuộc họp</div>';
  const a = m.analysis = m.analysis || {status:'idle', step:0};
  const STEPS = ['Snapshot (revision + provider + locale + mapping)','Map chunks (≤12,000 ký tự / chunk)','Hierarchical reduce (batch ≤8)','Match canonical tasks (theo project)','Publish (một lần, atomic)'];
  const pct = a.status==='completed'?100:Math.round((a.step/STEPS.length)*100);
  return `<div class="page-head"><div><h1>${S.locale==='en'?'Run analysis':'Chạy phân tích'}</h1>
    <div class="sub">S09 · ${esc(m.title)} · ${S.locale==='en'?'Step 3 of 3':'Bước 3/3'}</div></div>
    <div class="right"><span class="tag">S4.5–S4.11</span></div></div>
  <div class="grid2">
  <div class="card"><div class="card-h"><h2>${S.locale==='en'?'Run configuration':'Cấu hình run'}</h2><span class="badge mono">snapshot</span></div>
    <div class="card-b"><dl class="kv">
      <dt>Revision</dt><dd class="mono">v${m.currentRev} · ${m.versions[m.currentRev-1].sha}</dd>
      <dt>Provider</dt><dd>${esc(prov(S.settings.analysisProfile)?.name||'—')} <span class="tag">${prov(S.settings.analysisProfile)?.type||''}</span></dd>
      <dt>Model</dt><dd class="mono">${esc(prov(S.settings.analysisProfile)?.model||'—')}</dd>
      <dt>Output locale</dt><dd>${S.settings.outputLocale==='vi'?'Tiếng Việt':'English'} <span class="xsmall muted">(${S.locale==='en'?'separate from UI language':'khác ngôn ngữ giao diện'})</span></dd>
      <dt>Timezone</dt><dd class="mono">${m.tz}</dd>
      <dt>Context budget</dt><dd class="mono">32k tokens · output reserve 4k</dd>
    </dl>
    <div class="note mt-3">Run snapshot toàn bộ cấu hình ở thời điểm bắt đầu — sửa settings sau đó <b>không đổi run này</b>. Đổi provider giữa run phải cancel rồi tạo run mới. <span class="ref">S4.5</span></div>
    ${a.status==='completed'?`<div class="note blue mt-2">Run đã hoàn tất. Bấm "Chạy lại (fresh run)" để tạo AnalysisVersion mới — không overwrite (S4.12).</div>`:''}
  </div></div>
  <div class="card"><div class="card-h"><h2>${S.locale==='en'?'Progress':'Tiến độ'}</h2>
    <span class="badge ${a.status==='completed'?'ok':a.status==='failed'?'danger':a.status==='running'?'blue':'gray'}">${a.status}</span></div>
    <div class="card-b">
      <div class="prog ${a.status==='failed'?'gray':''}" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>
      <ul class="step-list mt-3">${STEPS.map((s,i)=>{
        const n=i+1; const st = a.status==='completed'?'succeeded': n<=a.step?(a.stepErr===n?'retryable_failed':'succeeded'):'pending';
        const ic = st==='succeeded'?'✓':st==='retryable_failed'?'↻':'·';
        return `<li><span class="stepnum ${st==='succeeded'?'done':''} ${n===a.step+1&&a.status==='running'?'now':''}">${ic}</span><span>${s}</span>
        <span class="st ${st==='retryable_failed'?'':'muted'}">${st==='succeeded'?(S.locale==='en'?'done':'xong'):st==='retryable_failed'?(S.locale==='en'?'retryable':'thử lại được'):(S.locale==='en'?'pending':'chờ')}</span></li>`;}).join('')}</ul>
      ${a.error?`<div class="note danger mt-2" role="alert"><b>${a.error.code}</b> — ${a.error.msg}${a.error.retryAfter?` · Retry-After: ${a.error.retryAfter}s`:''}<br><span class="xsmall">Retry do user xác nhận — provider có thể đã tính phí; không auto-retry ở SDK (S4.11).</span></div>`:''}
      <div class="row mt-3">
        ${a.status==='running'?`<button class="btn" onclick="App.runPause()">⏸ ${S.locale==='en'?'Pause':'Tạm dừng'}</button>`:''}
        ${['paused','idle','cancelled'].includes(a.status)?`<button class="btn primary" onclick="App.runStart()">▶ ${a.status==='paused'?(S.locale==='en'?'Resume':'Tiếp tục'):(S.locale==='en'?'Start run':'Bắt đầu run')}</button>`:''}
        ${a.status==='failed'?`<button class="btn primary" onclick="App.runRetry()">↻ ${S.locale==='en'?'Retry step':'Thử lại bước'}</button>`:''}
        ${['running','paused','failed'].includes(a.status)?`<button class="btn danger" onclick="App.runCancelDialog()">✕ ${t('cancel')} run</button>`:''}
        ${a.status==='completed'?`<button class="btn primary" onclick="go('#/meeting/${m.id}')">→ ${S.locale==='en'?'Open results':'Xem kết quả'}</button>
          <button class="btn" onclick="App.runStart()">${S.locale==='en'?'Re-analyze (fresh run)':'Phân tích lại (fresh run)'}</button>`:''}
      </div>
      <div class="row mt-2">
        <button class="btn sm" onclick="App.runSimulate('429')" title="Mô phỏng provider trả 429">⚡ ${S.locale==='en'?'Simulate 429':'Mô phỏng 429'}</button>
        <button class="btn sm" onclick="App.runSimulate('timeout')" title="Mô phỏng provider timeout 150s">⚡ ${S.locale==='en'?'Simulate timeout':'Mô phỏng timeout'}</button>
      </div>
      <div class="note mt-3"><b>Giới hạn mô phỏng trung thực:</b> client gọi từng bước khi trang active; đóng tab có thể làm request thất bại — chỉ kết quả đã commit được giữ, mở lại trang để tiếp tục từ checkpoint. Wireframe không giả lập "chạy tiếp khi đóng tab". <span class="ref">S4.8–S4.10</span></div>
    </div></div>
  </div>`;
}

/* ---------------- Quote registry (apostrophe-safe onclick) ---------------- */
const QUOTES=[];
function regQuote(label, quote, mid, rev, deleted){ QUOTES.push({label,quote,mid,rev,deleted:!!deleted}); return QUOTES.length-1; }
function citeChip(c){ const i=regQuote(c.label, c.quote, c.meetingId, c.rev||1, c.deleted);
  return `<button class="cite" onclick="App.openQuoteReg(${i})" ${c.deleted?'disabled title="Nguồn đã bị xóa — chỉ xem lại, không mở transcript"':''}>⌖ ${esc(c.label)}</button>`; }
function rTabSummary(m){
  if(!m.summary) return `<div class="empty"><div class="big">${S.locale==='en'?'Not analyzed yet':'Chưa phân tích'}</div>${S.locale==='en'?'Save raw first, then run analysis.':'Lưu raw trước, rồi chạy phân tích.'}<div class="mt-3"><button class="btn primary" onclick="go('#/meeting/${m.id}/analysis')">▶ ${S.locale==='en'?'Run analysis':'Chạy phân tích'}</button></div></div>`;
  const s = m.summary;
  const sec = (title, items, empty) => `<div class="card"><div class="card-h"><h3>${title}</h3></div><div class="card-b">${
    items.length? `<ul style="margin-left:18px" class="small">${items.map(x=>`<li style="margin-bottom:4px">${x}</li>`).join('')}</ul>` : `<span class="muted small">${empty}</span>`}</div></div>`;
  return `<div class="stack">
    <div class="note">Phân tích v${m.analysis.version} · ${esc(prov(m.analysis.profile)?.name||'')} · output ${m.analysis.locale==='vi'?'Tiếng Việt':'English'} · ${m.analysis.at}
      ${m.analysis.rev&&m.analysis.rev<m.currentRev?`<b> · badge cũ: phân tích này dựa trên revision ${m.analysis.rev}, không phải revision hiện hành ${m.currentRev}</b>`:''} <span class="ref">S4.4 · S4.5</span></div>
    ${sec('1 · Tổng quan / Overview',[esc(s.overview)],'Không ghi nhận')}
    ${sec('2 · Cập nhật theo người / Updates by person', s.byPerson.map(esc),'Không ghi nhận')}
    ${sec('3 · Blockers', s.blockers.map(esc),'Không ghi nhận')}
    ${sec('4 · Quyết định / Decisions', s.decisions.map(esc),'Không ghi nhận')}
    ${sec('5 · Todo', s.todos.map(x=>esc(x)),'Không ghi nhận')}
    <div class="note">Summary luôn gồm đủ 5 phần; không có bằng chứng thì ghi "Không ghi nhận", không bịa nội dung. Completion report chỉ lưu vào phần cập nhật — không tạo Todo mới. <span class="ref">Q8 · Q11 · S4.13</span></div>
  </div>`;
}
function rTabTodos(m){

  const appr = m.todos.filter(x=>x.state==='approved');
  const scope = S.ui.tdScope||'all';

  return `<div class="stack">
    <div class="row">
      <div class="seg" role="group" aria-label="Phạm vi Todo">
        <button class="${scope==='all'?'on':''}" onclick="App.tdScope('all')">${S.locale==='en'?'All':'Tất cả'}</button>
        <button class="${scope==='mine'?'on':''}" onclick="App.tdScope('mine')">${S.locale==='en'?'My':'Của tôi'}</button>
        <button class="${scope==='unassigned'?'on':''}" onclick="App.tdScope('unassigned')">${S.locale==='en'?'Unassigned':'Chưa gán'}</button>
      </div>
      <span class="muted small">${S.locale==='en'?'Pending todos show NO business status':'Todo chờ duyệt không hiển thị status nghiệp vụ'} <span class="tag">Q27</span></span>
    </div>
    <h3>${S.locale==='en'?'Pending (awaiting approval)':'Chờ duyệt'} <span class="badge blue">${filt(pend).length}</span></h3>
    ${filt(pend).map(x=>`<div class="item"><div class="item-t"><span class="ttl">${esc(x.title)}</span>${x.kind==='report'?'<span class="badge gray">completion report</span>':''}</div>
      <div class="meta"><span>${t('assignees')}: ${x.assignees.length?x.assignees.map(esc).join(', '):'<i>'+t('unknown')+'</i>'}</span>
        <span>${t('deadline')}: ${x.deadline?fmtDate(x.deadline):'—'}${x.raw?` <span class="tag">raw: ${esc(x.raw)}</span>`:''}</span></div>
      <div class="acts"><button class="btn sm primary" onclick="App.approveDialog('${x.id}')">✓ ${S.locale==='en'?'Review & approve':'Duyệt'}</button>
        <button class="btn sm" onclick="App.editPendingDialog('${x.id}')">✎ ${t('edit')}</button>
        <button class="btn sm quiet" onclick="App.rejectProposal('${x.proposal||x.id}')">✕ ${S.locale==='en'?'Reject':'Từ chối'}</button></div></div>`).join('')||`<div class="empty small">Không có mục nào trong phạm vi này</div>`}
    <h3 class="mt-4">${S.locale==='en'?'Approved / linked':'Đã duyệt / đã liên kết'}</h3>
    ${filt(appr).map(x=>`<div class="item"><div class="item-t"><span class="ttl">${esc(x.title)}</span>
      ${x.taskId?`<a class="badge mono" href="#/task/${x.taskId}" onclick="App.openTask('${x.taskId}')">${task(x.taskId)?.code}</a>`:'<span class="badge gray">chưa liên kết</span>'}</div>
      <div class="meta"><span>${x.assignees.map(esc).join(', ')||t('unknown')}</span><span>${x.deadline?fmtDate(x.deadline):'—'}</span></div></div>`).join('')||`<div class="empty small">Trống</div>`}
    <div class="note">Trạng thái review (pending/approved) <b>không phải</b> trạng thái công việc; mục đã duyệt đọc trạng thái từ Task liên kết. Deadline mơ hồ ("after lunch", "soon") để null và hiển thị raw phrase để sửa. <span class="ref">S5 · S5-deadline</span></div>
  </div>`;
}
function rTabTranscript(m){
  return `<div class="card"><div class="card-h"><h3>${S.locale==='en'?'Raw transcript — revision':'Nguyên văn — revision'} <span class="badge mono">v${m.currentRev} · ${m.versions[m.currentRev-1].sha}</span></h3>
    <button class="btn sm" onclick="App.editTranscriptDialog('${m.id}')">✎ ${t('edit')}</button></div>
    <div class="card-b"><pre class="quote" style="white-space:pre-wrap;font-size:12.5px;line-height:1.7">${esc(m.transcript)}</pre>
    <div class="note mt-3">Raw text lưu nguyên vẹn (immutable revision, sha256) — không normalize khi storage. Offset theo UTF-16, end-exclusive. <span class="ref">S3 · S4.1</span></div></div></div>`;
}
function rTabVersions(m){
  return `<div class="card"><div class="card-h"><h3>${S.locale==='en'?'Transcript versions':'Các phiên bản transcript'}</h3></div>
  <div class="card-b" style="padding:0"><div class="tbl-wrap"><table class="tbl">
    <thead><tr><th>Rev</th><th class="hide-xs">SHA-256</th><th>${S.locale==='en'?'Created':'Tạo lúc'}</th><th class="hide-xs">${S.locale==='en'?'Chars':'Ký tự'}</th><th>${t('status')}</th><th class="right">${t('actions')}</th></tr></thead>
    <tbody>${m.versions.slice().reverse().map(v=>`<tr>
      <td class="mono">v${v.n}</td><td class="mono hide-xs">${v.sha}</td><td>${v.at}</td><td class="num hide-xs">${v.chars.toLocaleString()}</td>
      <td>${v.n===m.currentRev?'<span class="badge blue">hiện hành</span>':`<span class="badge gray">${S.locale==='en'?'old':'cũ'} · analysis v1 gắn đây</span>`}</td>
      <td class="right"><button class="btn sm" onclick="App.viewRevision('${m.id}',${v.n})">${S.locale==='en'?'View':'Xem'}</button></td></tr>`).join('')}
    </tbody></table></div></div>
  <div class="card-f"><div class="note w100">Edit tạo revision mới; revision cũ immutable. Phân tích cũ gắn badge phiên bản cũ — không trình bày như kết quả của bản mới. Citation cũ vẫn mở được revision cũ khi meeting còn active. <span class="ref">S4.4</span></div></div></div>`;
}

/* ---------------- S11 Pending inbox ------------------------------------- */
function rPending(){
  const list = S.proposals;
  const groups = [['CREATE','CREATE — tạo task mới'],['LINK','LINK — liên kết task có sẵn'],['UPDATE','UPDATE — sửa task có sẵn'],['DONE','DONE — đề xuất hoàn thành'],['RECONCILE','Đối chiếu nghi trùng (uncertain match)']];
  const sel = S.ui.pendingSel;
  const bulkable = list.filter(p=>p.state==='pending'&&p.kind==='CREATE'&&!p.suspect);
  const allSelBulkable = sel.length>0 && sel.every(id=>bulkable.some(p=>p.id===id));
  const card = p => {
    const m = meet(p.meetingId); const tk = p.candidate?task(p.candidate):null;
    return `<div class="item ${sel.includes(p.id)?'sel':''}">
      <div class="item-t">
        ${p.state==='pending'&&p.kind==='CREATE'&&!p.suspect?`<input type="checkbox" aria-label="Chọn để duyệt hàng loạt" ${sel.includes(p.id)?'checked':''} onchange="App.selProposal('${p.id}',this.checked)">`:''}
        <span class="badge mono ${p.kind==='CREATE'?'blue':p.kind==='DONE'?'ok':''}">${p.kind}</span>
        <span class="ttl">${esc(p.title)}</span>
        ${p.state==='stale'?'<span class="badge danger">stale — bị chặn 409</span>':''}
        ${p.state==='rejected'?'<span class="badge gray">đã từ chối (suppression)</span>':''}
        ${p.suspect&&p.state==='pending'?'<span class="badge warn">nghi trùng</span>':''}
      </div>
      <div class="meta"><span>${S.locale==='en'?'Meeting':'Cuộc họp'}: ${esc(m?.title||'')}</span>${tk?`<span>→ ${tk.code} ${esc(tk.title)} <span class="tag">v${tk.version}</span></span>`:''}</div>
      ${p.quote?`<div class="quote clickable mt-2" onclick="App.openQuoteReg(${regQuote((m?.title||'')+' · rev '+(m?.currentRev||1), p.quote, p.meetingId, m?.currentRev||1)})">${esc(p.quote)}</div>`:''}
      ${p.before?`<div class="diff mt-2"><div class="d-col"><div class="d-h">${S.locale==='en'?'Before':'Trước'}</div><div class="d-b">${Object.entries(p.before).map(([k,v])=>`<div><span class="mono">${k}:</span> <span class="del">${esc(v)}</span></div>`).join('')}</div></div>
        <div class="d-col"><div class="d-h">${S.locale==='en'?'After':'Sau'}</div><div class="d-b">${Object.entries(p.after).map(([k,v])=>`<div><span class="mono">${k}:</span> <span class="ins">${esc(v)}</span></div>`).join('')}</div></div></div>`:''}
      ${p.note?`<div class="note mt-2">${p.note}</div>`:''}
      ${p.staleNote?`<div class="note danger mt-2">${p.staleNote}</div>`:''}
      ${p.state==='pending'?`<div class="acts">
        <button class="btn sm primary" onclick="App.approveDialog('${p.id}')">✓ ${S.locale==='en'?'Review & approve':'Duyệt'}</button>
        <button class="btn sm" onclick="App.editPendingDialog('${p.id}')">✎ ${S.locale==='en'?'Edit & save':'Sửa & lưu'}</button>
        <button class="btn sm quiet" onclick="App.rejectProposal('${p.id}')">✕ ${S.locale==='en'?'Reject':'Từ chối'}</button>
        ${p.kind==='LINK'?`<button class="btn sm" onclick="App.manualLinkDialog('${p.id}')">⌥ ${S.locale==='en'?'Pick task manually':'Tự chọn task'}</button>`:''}
      </div>`:''}
    </div>`;
  };
  return `<div class="page-head"><div><h1>${t('nav_pending')}</h1><div class="sub">S11 · ${S.locale==='en'?'Approve AI proposals into canonical tasks':'Duyệt đề xuất AI thành task chính thức'}</div></div></div>
  ${sel.length?`<div class="callout blue mb-3 row"><b>${S.locale==='en'?'Bulk selection':'Đã chọn hàng loạt'}: ${sel.length}</b>
    <button class="btn sm primary" ${allSelBulkable?'':'disabled'} onclick="App.bulkApprove()" ${allSelBulkable?'':'title="Bulk chỉ cho CREATE không nghi trùng (Q10/Q28)"'}>✓ ${S.locale==='en'?'Bulk approve as TODO':'Duyệt hàng loạt (TODO)'}</button>
    <button class="btn sm" onclick="App.clearSel()">${S.locale==='en'?'Clear':'Bỏ chọn'}</button>
    ${allSelBulkable?'':`<span class="xsmall">${S.locale==='en'?'Bulk is blocked: only non-suspect CREATE proposals are bulk-eligible; LINK/UPDATE/suspect need individual review (Q10).':'Bulk bị chặn: chỉ CREATE không nghi trùng được duyệt hàng loạt; LINK/UPDATE/nghi trùng phải duyệt riêng (Q10).'}</span>`}
  </div>`:''}
  ${groups.map(([k,label])=>{
    const items = list.filter(p=>p.kind===k);
    if(!items.length) return '';
    return `<div class="sec-title"><h2>${label}</h2><span class="badge">${items.length}</span></div><div class="stack">${items.map(card).join('')}</div>`;
  }).join('')}
  <div class="note mt-4"><b>Quy tắc duyệt:</b> duyệt riêng CREATE mặc định TODO và được đổi status ngay trong dialog; bulk luôn TODO. LINK/UPDATE hiển thị before/after + nguồn; trường đã đổi từ lúc đề xuất → stale chặn 409, trường khác đổi thì revalidate toàn bộ invariant. Reject lưu fingerprint — same semantics không đề xuất lại. <span class="ref">Q10 · Q19 · Q26 · Q28 · S5</span></div>`;
}

/* ---------------- S12 Tasks list ---------------------------------------- */
function rTasks(){
  const f = S.ui.tf = S.ui.tf || {scope:'all', proj:'', st:'', mFrom:'', mTo:'', dFrom:'', dTo:'', overdue:false};
  let list = S.tasks.slice();
  if(f.scope==='mine') list = list.filter(x=>x.assignees.includes('Mai Nguyễn'));
  if(f.scope==='unassigned') list = list.filter(x=>!x.assignees.length);
  if(f.proj) list = list.filter(x=>x.projectId===f.proj);
  if(f.st) list = list.filter(x=>x.status===f.st);
  if(f.overdue) list = list.filter(isOverdue);
  if(f.dFrom) list = list.filter(x=>x.deadline && x.deadline>=f.dFrom);
  if(f.dTo) list = list.filter(x=>x.deadline && x.deadline<=f.dTo);
  if(f.mFrom||f.mTo){ // meeting-date filter: only tasks with active evidence in range (manual unlinked excluded — Q23)
    list = list.filter(x=>x.sources.some(s=>{ const m=meet(s.meetingId); return m && m.status!=='trashed' && (!f.mFrom||m.date>=f.mFrom) && (!f.mTo||m.date<=f.mTo); }));
  }
  return `<div class="page-head"><div><h1>${t('nav_tasks')}</h1><div class="sub">S12 · ${S.locale==='en'?'Canonical tasks across meetings':'Công việc chính thức xuyên ngày'}</div></div>
    <div class="right"><button class="btn primary" onclick="go('#/tasks/new')">＋ ${S.locale==='en'?'New manual task':'Tạo việc thủ công'}</button></div></div>
  <div class="card mb-3"><div class="card-b">
    <div class="row mb-2">
      <div class="seg" role="group" aria-label="Phạm vi">
        <button class="${f.scope==='all'?'on':''}" onclick="App.tf('scope','all')">${S.locale==='en'?'All':'Tất cả'}</button>
        <button class="${f.scope==='mine'?'on':''}" onclick="App.tf('scope','mine')">${S.locale==='en'?'My':'Của tôi'}</button>
        <button class="${f.scope==='unassigned'?'on':''}" onclick="App.tf('scope','unassigned')">${S.locale==='en'?'Unassigned':'Chưa gán'}</button>
      </div>
      <select class="input" style="width:auto" onchange="App.tf('proj',this.value)" aria-label="${t('project')}">
        <option value="">${t('project')}: ${S.locale==='en'?'all':'tất cả'}</option>
        ${S.projects.map(p=>`<option value="${p.id}" ${f.proj===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select>
      <select class="input" style="width:auto" onchange="App.tf('st',this.value)" aria-label="${t('status')}">
        <option value="">${t('status')}: ${S.locale==='en'?'all':'tất cả'}</option>
        ${['TODO','IN_PROGRESS','BLOCKED','DONE','CANCELLED'].map(s=>`<option value="${s}" ${f.st===s?'selected':''}>${stLabel(s)}</option>`).join('')}</select>
    </div>
    <div class="row">
      <span class="xsmall muted nowrap">${S.locale==='en'?'Meeting date':'Ngày họp'}</span>
      <input class="input" type="date" style="width:auto" value="${f.mFrom}" onchange="App.tf('mFrom',this.value)" aria-label="Từ ngày họp">
      <span class="faint">→</span>
      <input class="input" type="date" style="width:auto" value="${f.mTo}" onchange="App.tf('mTo',this.value)" aria-label="Đến ngày họp">
      <span class="xsmall muted nowrap" style="margin-left:8px">${t('deadline')}</span>
      <input class="input" type="date" style="width:auto" value="${f.dFrom}" onchange="App.tf('dFrom',this.value)" aria-label="Hạn từ">
      <span class="faint">→</span>
      <input class="input" type="date" style="width:auto" value="${f.dTo}" onchange="App.tf('dTo',this.value)" aria-label="Hạn đến">
      <label class="check" style="margin-left:8px"><input type="checkbox" ${f.overdue?'checked':''} onchange="App.tf('overdue',this.checked)"> ${S.locale==='en'?'Overdue only':'Chỉ quá hạn'} <span class="tag">Q16</span></label>
      <span class="muted small right">${list.length} ${S.locale==='en'?'tasks':'việc'}</span>
    </div>
    <div class="note mt-2">Hai filter <b>độc lập</b>: ngày họp (theo evidence active của meeting trong khoảng) và hạn chót; giao nhau khi cùng có. Task thủ công chưa liên kết <b>không</b> match filter ngày họp — không dùng createdAt thay thế. <span class="ref">Q15 · Q23 · S5</span></div>
  </div></div>
  <div class="card"><div class="card-b" style="padding:0"><div class="tbl-wrap"><table class="tbl">
    <thead><tr><th>${t('title')}</th><th class="hide-xs">${t('project')}</th><th>${t('status')}</th><th class="hide-xs">${t('assignees')}</th><th>${t('deadline')}</th><th class="hide-xs">${t('meetingDate')}</th><th class="hide-xs">${t('source')}</th></tr></thead>
    <tbody>${list.map(x=>`<tr ${isOverdue(x)?'style="background:var(--warn-bg)"':''}>
      <td><a href="#/task/${x.id}" onclick="App.openTask('${x.id}')"><b>${x.code}</b> · ${esc(x.title)}</a>
        ${x.sourceChanged?'<span class="badge warn">nguồn đã đổi</span>':''}
        ${x.origin==='MANUAL'?'<span class="badge gray">MANUAL</span>':''}</td>
      <td class="hide-xs">${esc(projName(x.projectId))}</td>
      <td>${stBadge(x.status)}</td>
      <td class="hide-xs">${x.assignees.length?x.assignees.map(a=>`<span class="avatar-sq" title="${esc(a)}">${esc(a.split(' ')[0][0])}</span>`).join(' '):'<span class="faint">'+t('unknown')+'</span>'}</td>
      <td class="nowrap">${x.deadline?fmtDate(x.deadline):'—'}${isOverdue(x)?' <span class="badge danger">quá hạn</span>':''}</td>
      <td class="hide-xs">${x.sources.length?x.sources.map(s=>fmtDate(meet(s.meetingId)?.date)).join(', '):'<span class="faint">— chưa liên kết</span>'}</td>
      <td class="hide-xs">${x.sources.length?`<span class="badge mono">${x.sources.length} nguồn</span>`:'<span class="faint">không cần citation</span>'}</td>
    </tr>`).join('')}</tbody></table></div></div></div>`;
}

/* ---------------- S14 Task detail ---------------------------------------- */
function rTaskDetail(){
  const x = task(S.ui.taskId); if(!x) return '<div class="empty">Không tìm thấy task</div>';
  return `<div class="page-head"><div>
    <div class="crumb mb-2"><a href="#/tasks">${t('nav_tasks')}</a> / <b>${x.code}</b></div>

function rChatMsg(msg){
  const who = msg.role==='user'?'Mai Nguyễn':'assistant';
  let body = `<div class="bubble">${esc(msg.text)}`;
  if(msg.kind==='twoGroups' && msg.groups){
    body += `<div class="grid2 mt-2">
      <div><h3 class="xsmall" style="text-transform:uppercase;letter-spacing:.06em">${S.locale==='en'?'Approved tasks — not done':'Task chính thức chưa xong'}</h3>
      <ul class="small" style="margin-left:16px">${msg.groups.approved.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
      <div><h3 class="xsmall" style="text-transform:uppercase;letter-spacing:.06em">${S.locale==='en'?'Pending todos (no status)':'Todo chờ duyệt (không status)'}</h3>
      <ul class="small" style="margin-left:16px">${msg.groups.pending.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></div>`;
  }
  if(msg.kind==='history'){
    body += `<div class="grid2 mt-2">
      <div class="d-col" style="border:1px solid var(--line);border-radius:6px"><div class="d-h">${S.locale==='en'?'Recorded in app':'Trạng thái đã ghi nhận trong ứng dụng'}</div><div class="d-b small">${msg.appHistory.map(esc).join('<br>')}</div></div>
      <div class="d-col" style="border:1px solid var(--line);border-radius:6px"><div class="d-h">${S.locale==='en'?'From meeting evidence':'Thông tin từ cuộc họp tính đến mốc đó'}</div><div class="d-b small">${msg.meetingEvidence.map(esc).join('<br>')}</div></div></div>`;
  }
  if(msg.cites && msg.cites.length) body += `<div class="mt-2">${msg.cites.map(cite=>citeChip(cite)).join('')}</div>`;
  if(msg.conflict) body += `<div class="note warn mt-2">${esc(msg.conflict)}</div>`;
  if(msg.note) body += `<div class="note mt-2">${esc(msg.note)}</div>`;
  if(msg.error) body += `<div class="note danger mt-2" role="alert">${esc(msg.error)} <button class="btn sm" onclick="App.retryLast()">↻ ${S.locale==='en'?'Resume / retry':'Tiếp tục / thử lại'}</button></div>`;
  if(msg.clarify) body += `<div class="row mt-2">
    <button class="btn sm" data-clarify="meeting">${S.locale==='en'?'By meeting date':'Theo ngày họp'}</button>
    <button class="btn sm" data-clarify="deadline">${S.locale==='en'?'By deadline':'Theo hạn chót'}</button>
    <span class="xsmall muted">${S.locale==='en'?'CLARIFY turn — choice is remembered for the next one (Q15)':'Lượt CLARIFY — lựa chọn được nhớ cho lượt tiếp theo (Q15)'}</span></div>`;
  body += `</div>`;
  return `<div class="msg ${msg.role}"><div class="av">${msg.role==='user'?'M':'AI'}</div><div class="body"><div class="who">${who}${msg.contextEligible===false?' · <span class="badge danger">loại khỏi ngữ cảnh mới</span>':''}</div>${body}</div></div>`;
}

      if(a.status!=='running'){ clearInterval(window.__runTimer); return; }

      if(a.step>=5){ a.status='completed'; clearInterval(window.__runTimer);

        else { App.generateAnalysis(m); saveState(); route(); toast(S.locale==='en'?'Analysis published (simulated, atomic)':'Đã publish phân tích (mô phỏng, một lần)'); }

  approveSave(id,kind){ const p=S.proposals.find(x=>x.id===id); const td=p?null:S.meetings.flatMap(m=>m.todos).find(x=>x.id===id);

  askSample(i){ const s=SAMPLES[i]; S.ui.chatBusy=true; const c=conv(S.ui.threadId);

  ask(ev){ ev.preventDefault(); const inp=document.getElementById('chat-q'); const q=inp.value.trim(); if(!q||S.ui.chatBusy) return false;
    const c=conv(S.ui.threadId); S.ui.chatBusy=true; c.messages.push({role:'user', text:q}); saveState(); route();
    let kind='noEvidence';
    if(/chưa xong|bao nhiêu|còn lại/i.test(q)) kind='twoGroups';

    if(kind==='clarify') return {role:'assistant', kind, text:'"Tuần này" chưa rõ phạm vi: bạn muốn hỏi theo ngày họp diễn ra trong tuần, hay theo hạn chót (deadline) rơi vào tuần này?', clarify:true};
    if(kind==='deleted') return {role:'assistant', kind, text:'Khách hàng FPT yêu cầu xuất báo cáo tuần định dạng Excel vào mỗi thứ Hai.',

  const b=e.target.closest('[data-clarify]'); if(b) App.clarifyAnswer(b.getAttribute('data-clarify'));
});

/* ---------------- Init ----------------------------------------------------- */
window.addEventListener('hashchange', route);
document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){ App.closeDrawer(); }
  if((e.key==='l'||e.key==='L') && S.auth.loggedIn && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) && !document.querySelector('dialog[open]')){
    App.logout(); }
});
loadState();
if(!location.hash) location.hash = S.auth.loggedIn ? '#/dashboard' : '#/login';
route();

</script>
</body>
</html>
